name: Supabase Keep-Alive

# 무료 플랜은 7일간 "충분한 활동"이 없으면 프로젝트를 자동 일시정지한다.
#
# 중요: anon 키로 보내는 읽기 핑은 RLS에 막혀 빈 배열([])만 돌려받기 때문에
# Supabase가 활동으로 집계하지 않는다. (실제로 30회 연속 성공했는데도 정지됨)
# 그래서 service_role 키로 keepalive 테이블에 실제 쓰기를 발생시킨다.
#
# 사전 준비:
#   1) supabase_keepalive.sql 을 Supabase SQL Editor에서 1회 실행
#   2) gh secret set SUPABASE_SERVICE_ROLE_KEY
on:
  schedule:
    - cron: '0 0 */3 * *' # 3일마다 00:00 UTC (KST 09:00)
  workflow_dispatch: # 수동 실행용

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write to keepalive table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          # 어떤 프로젝트를 깨우고 있는지 로그에 남긴다.
          # (project ref는 프론트엔드 번들에도 포함되는 공개 값이라 비밀이 아니다)
          project_ref=$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')
          echo "target project ref: $project_ref"

          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "mode: write (service_role)"
            key="$SUPABASE_SERVICE_ROLE_KEY"
            now=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 30 \
              -X POST "$SUPABASE_URL/rest/v1/keepalive" \
              -H "apikey: $key" \
              -H "Authorization: Bearer $key" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=representation" \
              -d "{\"id\":1,\"pinged_at\":\"$now\",\"note\":\"github-actions\"}") || code=000
          else
            # 폴백: service_role 키가 없으면 기존 anon 읽기 핑.
            # 정지를 확실히 막아주지는 못하므로 경고를 남긴다.
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY가 없어 anon 읽기 핑으로 대체합니다. 이 방식은 자동 일시정지를 막지 못할 수 있습니다."
            echo "mode: read (anon fallback)"
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 30 \
              "$SUPABASE_URL/rest/v1/user_asset_data?select=user_id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY") || code=000
          fi

          body=$(cat /tmp/body 2>/dev/null)
          echo "HTTP $code"
          echo "response: $body"

          # 0 = DNS 조회 실패 등 네트워크 레벨 실패 (일시정지된 프로젝트의 전형적인 증상)
          if [ "$code" = "000" ]; then
            echo "::error::Supabase 접속 실패. 프로젝트가 일시정지되어 호스트가 사라졌을 수 있습니다."
            exit 1
          fi

          case "$code" in
            20*) ;;
            404)
              echo "::error::keepalive 테이블이 없습니다. supabase_keepalive.sql 을 SQL Editor에서 실행해 주세요."
              exit 1
              ;;
            *)
              echo "::error::Supabase ping 실패 (HTTP $code). 프로젝트가 이미 일시정지됐거나 키가 만료됐을 수 있습니다."
              exit 1
              ;;
          esac

          case "$body" in
            *'Bad Gateway'*|*'PGRST'*)
              echo "::error::HTTP $code 이지만 응답이 에러입니다: $body"
              exit 1
              ;;
          esac

          echo "✅ Supabase 프로젝트($project_ref) 활성 상태 유지됨"
