name: Supabase Keep-Alive

# 무료 플랜은 7일간 활동이 없으면 프로젝트를 자동 일시정지한다.
# 3일마다 가벼운 REST 쿼리를 날려 활동을 발생시켜 정지를 막는다.
#
# 주의: keep-alive는 '비활동으로 인한 정지'만 막는다.
# 무료 플랜의 활성 프로젝트 개수 한도를 넘겨서 정지되는 경우는 막지 못하므로,
# ping이 성공하는데도 프로젝트가 멈춘다면 Supabase 대시보드에서 프로젝트 수를 확인할 것.
on:
  schedule:
    - cron: '0 0 */3 * *' # 3일마다 00:00 UTC (KST 09:00)
  workflow_dispatch: # 수동 실행용

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          # 어떤 프로젝트를 깨우고 있는지 로그에 남긴다.
          # (project ref는 프론트엔드 번들에도 포함되는 공개 값이라 비밀이 아니다)
          project_ref=$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')
          echo "target project ref: $project_ref"

          code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/user_asset_data?select=user_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY") || code=000

          body=$(cat /tmp/body 2>/dev/null)
          echo "HTTP $code"
          echo "response: $body"

          # 0 = DNS 조회 실패 등 네트워크 레벨 실패 (일시정지된 프로젝트의 전형적인 증상)
          if [ "$code" = "000" ]; then
            echo "::error::Supabase 접속 실패. 프로젝트가 일시정지되어 호스트가 사라졌을 수 있습니다."
            exit 1
          fi

          # 복구 직후나 정지 전환 중에는 502/503이 뜬다. 200이어도 에러 본문이면 실패로 본다.
          if [ "$code" != "200" ]; then
            echo "::error::Supabase ping 실패 (HTTP $code). 프로젝트가 이미 일시정지됐거나 키가 만료됐을 수 있습니다."
            exit 1
          fi

          case "$body" in
            *'"message"'*|*'Bad Gateway'*|*'PGRST'*)
              echo "::error::HTTP 200이지만 응답이 정상 데이터가 아닙니다: $body"
              exit 1
              ;;
          esac

          # RLS로 anon은 빈 배열([])을 받지만 DB 쿼리는 실행되므로 활동으로 집계된다.
          echo "✅ Supabase 프로젝트($project_ref) 활성 상태 유지됨"
