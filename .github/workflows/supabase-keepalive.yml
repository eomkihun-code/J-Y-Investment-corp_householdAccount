name: Supabase Keep-Alive

# 무료 플랜은 7일간 활동이 없으면 프로젝트를 자동 일시정지한다.
# 3일마다 가벼운 REST 쿼리를 날려 활동을 발생시켜 정지를 막는다.
on:
  schedule:
    - cron: '0 0 */3 * *' # 3일마다 00:00 UTC (KST 09:00)
  workflow_dispatch: # 수동 실행용

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/user_asset_data?select=user_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")

          echo "HTTP $code"
          echo "response: $(cat /tmp/body)"

          # RLS로 anon은 빈 배열([])을 받지만 DB 쿼리는 실행되므로 활동으로 집계된다.
          if [ "$code" != "200" ]; then
            echo "::error::Supabase ping 실패 (HTTP $code). 프로젝트가 이미 일시정지됐거나 키가 만료됐을 수 있습니다."
            exit 1
          fi

          echo "✅ Supabase 프로젝트 활성 상태 유지됨"
